# Tema original "Anéis": três anéis concêntricos (CPU, GPU, RAM) com o FPS no centro, em paisagem (480x320).
# Fundo gerado por gerar_fundo.py (centro, raios e ângulos dos anéis ficam nas constantes de lá).
author: "luis"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 40, 214, 255

static_images:
