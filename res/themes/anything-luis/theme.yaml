# Tema original "Anything": pôr do sol pintado à mão, cartões de papel e letra manuscrita, em paisagem (480x320).
# Fundo gerado por gerar_fundo.py. Barras atualizam a cada 1 s para a tela parecer respirar.
author: "luis"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 255, 170, 120
static_images:
