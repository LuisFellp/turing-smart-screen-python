# Tema original "Fade": entardecer enevoado, bokeh e grão de filme, em paisagem (480x320). Fonte: Maple Mono.
# Fundo gerado por gerar_fundo.py. Inspirado em "Fade Into You" (Mazzy Star).
author: "luis"

display:
